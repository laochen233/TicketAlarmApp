name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Android SDK
        run: |
          set -e
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "latest" ]; then
            wget --tries=2 --timeout=300 -O cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            [ -d cmdline-tools ] && mv cmdline-tools latest || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 接受协议 + 装平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 准备 Gradle 8.9
        run: |
          set -e
          GRADLE_DIR="/opt/gradle-8.9"
          if [ ! -d "$GRADLE_DIR" ]; then
            echo "下载 Gradle 8.9..."
            cd /tmp
            wget --tries=3 --timeout=300 -O gradle-8.9-bin.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip
            ls -lh gradle-8.9-bin.zip
            unzip -q gradle-8.9-bin.zip -d /opt/
          fi
          echo "✅ Gradle 解压完成"
          ls "$GRADLE_DIR/bin/gradle"
          echo "$GRADLE_DIR/bin" >> $GITHUB_PATH

      - name: 编译 Debug APK
        run: |
          cd "$GITHUB_WORKSPACE"
          # 关键: Kotlin 编译是 fork 出去的独立 worker 进程,默认只分到约 512MB
          # 编译 material 1.12.0 全家桶容易 OOM 被 worker 调度层 kill → 报 GradleKotlinCompilerWorkAction 崩溃
          # 必须给 Kotlin daemon 单独内存 + 限制 worker 并发(org.gradle.jvmargs 只管 Gradle 主进程,管不到 Kotlin 子进程)
          echo "kotlin.daemon.jvmargs=-Xmx2048m -Xms512m" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          export GRADLE_OPTS="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          export KOTLIN_DAEMON_JVMARGS="-Xmx2048m"
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -500

      - name: 验证 APK 是否生成
        run: |
          echo "=== 查找 APK ==="
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || echo "(本步未找到)"
          echo "=== debug 目录 ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "(debug 目录不存在)"
          echo "✅ 验证步骤结束"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ticket-alarm-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
